<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Sliding Block Puzzle</title>
    <meta name="description" content="A modern, high-performance sliding block puzzle web app built with React & TypeScript" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SlidingPuzzle" />
    <script>
      // 저장된 언어로 문서 언어를 먼저 맞춰 초기 렌더링의 lang 불일치를 막음
      try {
        var savedLang = localStorage.getItem('sliding_puzzle_lang');
        if (savedLang && ['ko', 'en', 'ja', 'zh'].indexOf(savedLang) !== -1) {
          document.documentElement.lang = savedLang;
        }
      } catch (e) {}
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Direct Spritesheet Styles -->
    <link rel="stylesheet" href="./assets/sprites/sheet_ui_fx.css" />

    <!-- Asset Preload for Instant First Render -->
    <link rel="preload" as="image" href="./assets/sprites/ui_icons_spritesheet.png" />
    <link rel="preload" as="image" href="./assets/images/theme_nature.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
