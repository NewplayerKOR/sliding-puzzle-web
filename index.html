    <title>Sliding Block Puzzle</title>
    <meta name="description" content="A modern, high-performance sliding block puzzle web app built with React & TypeScript" />

    <link rel="manifest" href="./manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SlidingPuzzle" />
    <script>
      // 저장된 언어로 문서 언어를 먼저 맞춰 초기 렌더링의 lang 불일치를 막음
      try {
        var savedLang = localStorage.getItem('sliding_puzzle_lang');
        if (savedLang && ['ko', 'en', 'ja', 'zh'].indexOf(savedLang) !== -1) {
          document.documentElement.lang = savedLang;
        }
      } catch (e) {}
    </script>

    <!-- Asset Preload for Instant First Render -->
    <link rel="preload" as="image" href="./assets/images/theme_nature.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
